name: Publish wiki

# docs/wiki is the source of the GitHub wiki, so a PR can change code and docs together.
on:
  push:
    branches: [master]
    paths: ['docs/wiki/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency: wiki

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push docs/wiki to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
          else
            git commit -m "Sync from ${GITHUB_SHA::7}"
            git push
          fi
